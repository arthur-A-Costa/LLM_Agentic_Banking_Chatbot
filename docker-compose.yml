services:
  postgres:
    image: pgvector/pgvector:pg16-trixie
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ollama_docker

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - 11434:11434
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - ollama_docker
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  backend:
    build:
      context: "."
      dockerfile: "dockerfile.backend"
    container_name: backend
    depends_on:
      - ollama
      - postgres
      - chromadb
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      DATABASE_URL: postgresql://postgres_user:postgres_password@postgres:5432/postgres
      ENABLE_REVIEW_AGENT: true
      DEFAULT_MODEL: qwen3:8b
      ALTERNATIVE_MODEL: qwen2.5:1.5b
      ROUTER_MODEL: qwen2.5:1.5b
      SALESMAN_MODEL: qwen3:8b
      CONSULTANT_MODEL: qwen3:8b
      REVIEWER_MODEL: qwen3:8b
      EMBEDDING_MODEL: bge-m3
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      CHROMA_COLLECTION: consortium_docs
      RAG_SOURCE_DIR: app/data/rag_resources
      VECTOR_STORE_TYPE: pgvector
      EXA_API_KEY: ${EXA_API_KEY}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    networks:
      - ollama_docker

  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data
    restart: unless-stopped
    networks:
      - ollama_docker

  frontend:
    build:
      context: "."
      dockerfile: "dockerfile.frontend"
    container_name: streamlit_frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    volumes:
      - ./frontend:/frontend
    environment:
      - BACKEND_URL=http://backend:8000
    networks:
      - ollama_docker

  mcp_server:
    build:
      context: "."
      dockerfile: "dockerfile.mcp"
    container_name: mcp_server
    depends_on:
      - postgres
      - ollama
      - chromadb
    volumes:
      - ./app:/app/app
      - ./mcp_server:/app/mcp_server  
    environment:
      DATABASE_URL: postgresql://postgres_user:postgres_password@postgres:5432/postgres
      OLLAMA_BASE_URL: http://ollama:11434
      EMBEDDING_MODEL: bge-m3
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      CHROMA_COLLECTION: consortium_docs
      RAG_SOURCE_DIR: app/data/rag_resources
      VECTOR_STORE_TYPE: pgvector
      EXA_API_KEY: ${EXA_API_KEY}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT}
      JINA_AUTH_KEY: ${JINA_AUTH_KEY}
      JINA: ${JINA}
      JINA_MAX_PAGE: ${JINA_MAX_PAGE}
    ports:
      - "8010:8001"
    networks:
      - ollama_docker

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend
    networks:
      - ollama_docker

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - ollama_docker

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - 8080:8080
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - ollama_docker

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres_exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres_user:postgres_password@postgres:5432/postgres?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - postgres
    networks:
      - ollama_docker

volumes:
  postgres_data:
  ollama_data:
  chroma_data:
  grafana_data:

networks:
  ollama_docker: